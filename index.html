<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight Companion — UFC, minus the noise</title>
<meta name="description" content="Real UFC cards only. Fighter breakdowns for casual fans, live results, and belts explained in plain English.">
<meta property="og:title" content="Fight Companion">
<meta property="og:description" content="UFC, minus the noise — fight cards, breakdowns, live results and belts explained for casual fans.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Comp">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="logo">Fight <b>Companion</b><small>UFC, minus the noise</small></div>
    <button class="icon-btn" id="gearBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="dot"></span></button>
  </div>
</header>

<main class="wrap">
  <section class="page active" id="page-fights" aria-label="Fight cards">
    <div id="fightsView">
      <div class="card" style="padding:18px;margin-top:4px"><div class="skel" style="width:40%"></div><div class="skel" style="width:75%;height:26px;margin-top:12px"></div><div class="skel" style="width:55%;margin-top:12px"></div></div>
      <div class="card" style="padding:18px;margin-top:12px"><div class="skel"></div><div class="skel" style="margin-top:12px"></div><div class="skel" style="width:60%;margin-top:12px"></div></div>
    </div>
  </section>
  <section class="page" id="page-rankings" aria-label="Rankings"><div id="rankingsView"></div></section>
  <section class="page" id="page-learn" aria-label="Catch up"><div id="learnView"></div></section>
</main>

<div id="a2hs" role="complementary" aria-label="Install the app">
  <div class="a2hs-in">
    <img src="apple-touch-icon.png" alt="">
    <div class="a2hs-t"><b>Get the app feel</b><span id="a2hsHint"></span></div>
    <button class="btn gold" id="a2hsInstall" type="button" hidden>Install</button>
    <button class="a2hs-x" id="a2hsClose" type="button" aria-label="Dismiss">&times;</button>
  </div>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab active" type="button" data-page="fights" aria-current="page">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      Fights<span class="ldot"></span>
    </button>
    <button class="tab" type="button" data-page="rankings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="5"/><path d="M9 8.5 6 3h4l2 3.5L14 3h4l-3 5.5"/></svg>
      Rankings
    </button>
    <button class="tab" type="button" data-page="learn">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>
      Catch Up
    </button>
  </div>
</nav>

<script src="app.js"></script>
<script src="data.js"></script>
</body>
</html>
